<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6f4b3e">
<link rel="manifest" href="manifest.json">
<title>Bellas Imports</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8f1ec;--card:#fff;--ink:#5c4036;--muted:#92776b;--line:#eadbd3;--accent:#b47a5d;--dark:#6f4b3e;--ok:#6b8c73;--danger:#a84e48}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#login{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#6f4b3e,#a67861)}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0004}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.brand-logo{width:52px;height:52px;border-radius:50%;overflow:hidden;background:#f9e9df;flex:0 0 auto}.brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;outline:none}.field textarea{min-height:90px}
.primary{border:0;background:var(--dark);color:#fff;border-radius:10px;padding:11px 15px;font-weight:700}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700}.danger{border:0;background:#f9e2df;color:#8f352f;border-radius:9px;padding:8px 10px}
.layout{min-height:100vh;display:flex}.sidebar{width:245px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;z-index:30}.sidebar nav{display:grid;gap:6px;margin-top:22px}.nav-btn{border:0;background:transparent;color:var(--ink);padding:11px 12px;text-align:left;border-radius:9px}.nav-btn.active,.nav-btn:hover{background:#f4e5dc}.sidebar-bottom{margin-top:auto;display:grid;gap:8px}
.content{margin-left:245px;padding:22px;min-width:0;flex:1}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.topbar h2{margin:2px 0 0;font-size:24px}.top-actions{display:flex;align-items:center;gap:8px}.status{padding:7px 9px;border-radius:999px;font-size:12px;background:#eaf4ee;color:#436650}.status.off{background:#fff0e8;color:#8c4e2b}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.metric{font-size:26px;font-weight:800;margin-top:4px}.muted,.small{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:320px;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{background:#fcf8f5}tr:last-child td{border-bottom:0}.badge{display:inline-block;background:#f3eae5;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700}
.empty{text-align:center;padding:30px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:10px;z-index:100}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.mobile-menu{display:none}.bottom-sync{display:none}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.content{margin-left:0;padding:14px 14px 78px}.mobile-menu{display:block;background:var(--dark);color:#fff;border:0;border-radius:9px;padding:9px 11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom-sync{position:fixed;display:flex;left:0;right:0;bottom:0;background:var(--dark);color:#fff;padding:9px 12px;justify-content:space-between;align-items:center;z-index:40}.bottom-sync .primary{background:#fff;color:var(--dark);padding:8px 10px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.back-btn{padding:8px 10px;font-size:12px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.form-actions button{flex:1 1 100%}}
@media print{.sidebar,.topbar,.bottom-sync,.mobile-menu,.form-actions{display:none!important}.content{margin:0!important;padding:0!important}.modal.show{position:static;background:#fff}.modal-card{width:100%;max-height:none;box-shadow:none;border:0}}
</style>
</head>
<body>
<section id="login">
 <div class="login-card">
  <div class="logo"><div class="brand-logo"><img id="loginLogo" alt="Bellas Imports"></div><div>Bellas Imports</div></div>
  <h1>ERP Bellas Imports</h1>
  <p class="muted">Produtos, clientes, pedidos e viagens.</p>
  <div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div>
  <div class="field"><label>Palavra-passe</label><input id="loginPass" type="password"></div>
  <button class="primary" style="width:100%" onclick="doLogin()">Entrar</button>
  <div id="loginMsg" class="small" style="margin-top:10px"></div>
 </div>
</section>

<section id="app" class="hidden">
 <div class="layout">
  <aside class="sidebar" id="sidebar">
   <div class="logo"><div class="brand-logo"><img id="sideLogo" alt="Bellas Imports"></div><div>Bellas Imports</div></div>
   <nav>
    <button class="nav-btn active" data-page="dashboard" onclick="go('dashboard')">Dashboard</button>
    <button class="nav-btn" data-page="clientes" onclick="go('clientes')">Clientes</button>
    <button class="nav-btn" data-page="produtos" onclick="go('produtos')">Produtos</button>
    <button class="nav-btn" data-page="pedidos" onclick="go('pedidos')">Pedidos</button>
    <button class="nav-btn" data-page="viagens" onclick="go('viagens')">Viagens</button>
    <button class="nav-btn" data-page="fechamento" onclick="go('fechamento')">Fechamento do mês</button>
   </nav>
   <div class="sidebar-bottom">
    <button class="secondary" onclick="syncNow()">☁️ Sincronizar</button>
    <button class="secondary" onclick="testSync()">🧪 Testar conexão</button>
    <button class="danger" onclick="logout()">Sair</button>
   </div>
  </aside>

  <main class="content">
   <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="secondary back-btn" onclick="voltarPagina()">← Voltar</button>
      <button class="mobile-menu" onclick="toggleMenu()">☰</button>
      <div><div class="small">Bellas Imports</div><h2 id="pageTitle">Dashboard</h2></div>
    </div>
    <span id="conn" class="status">Conectando...</span>
   </div>
   <div id="page"></div>
  </main>
 </div>
 <div class="bottom-sync"><span id="mobileSyncStatus">Online</span><button class="primary" onclick="syncNow()">☁️ Sincronizar</button></div>
</section>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script>
const SUPABASE_URL='https://dbckbqpvalfoolckiyne.supabase.co';
const SUPABASE_KEY='sb_publishable_9FMuQuSDNY_RwZgKrCCaIw_2J_ysKki';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const TABLES=['clientes','produtos','pedidos','pedido_itens','viagens'];
const CACHE_KEY='bellas_rpc_cache_v1';
let cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');
for(const t of TABLES)if(!Array.isArray(cache[t]))cache[t]=[];
let data=cache;
let queue=JSON.parse(localStorage.getItem('bellas_rpc_queue_v1')||'[]');
let page='dashboard', history=['dashboard'];
let tempItems=[];

function persist(){localStorage.setItem(CACHE_KEY,JSON.stringify(data));localStorage.setItem('bellas_rpc_queue_v1',JSON.stringify(queue))}
function uid(){return crypto.randomUUID()} function now(){return new Date().toISOString()}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setStatus(text,off=false){const e=document.getElementById('conn');e.textContent=text;e.className='status'+(off?' off':'');document.getElementById('mobileSyncStatus').textContent=text}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function go(p){if(p!==page)history.push(p);page=p;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));toggleMenu();render()}
function voltarPagina(){if(document.getElementById('modal').classList.contains('show')){closeModal();return}if(history.length>1){history.pop();page=history[history.length-1]}else page='dashboard';document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render()}
function openModal(title,body){document.getElementById('modalCard').innerHTML=`<div class="modal-head"><div style="display:flex;align-items:center;gap:8px"><button class="secondary" onclick="voltarPagina()">← Voltar</button><h3 style="margin:0">${title}</h3></div><button class="secondary" onclick="closeModal()">Fechar</button></div>${body}`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function doLogin(){const email=loginEmail.value.trim(),password=loginPass.value;loginMsg.textContent='Entrando...';const {error}=await sb.auth.signInWithPassword({email,password});if(error){loginMsg.textContent=error.message;return}await enter()}
async function enter(){login.classList.add('hidden');app.classList.remove('hidden');render();if(navigator.onLine)await syncNow()}
async function logout(){await sb.auth.signOut();location.reload()}

function render(){const titles={dashboard:'Dashboard',clientes:'Clientes',produtos:'Produtos',pedidos:'Pedidos',viagens:'Viagens',fechamento:'Fechamento do mês'};pageTitle.textContent=titles[page];if(page==='dashboard')pageEl(dashboardHtml());if(page==='clientes')pageEl(clientesHtml());if(page==='produtos')pageEl(produtosHtml());if(page==='pedidos')pageEl(pedidosHtml());if(page==='viagens')pageEl(viagensHtml());if(page==='fechamento')pageEl(fechamentoHtml())}
function pageEl(x){document.getElementById('page').innerHTML=x}
function listHeader(fn,label){return `<div class="toolbar"><button class="primary" onclick="${fn}">+ ${label}</button><input id="search" placeholder="Pesquisar..." oninput="filterTable()"></div>`}
function dashboardHtml(){const low=data.produtos.filter(p=>Number(p.estoque||0)<=Number(p.estoque_minimo||0)).length;return `<div class="grid"><div class="card"><div class="muted">Clientes</div><div class="metric">${data.clientes.length}</div></div><div class="card"><div class="muted">Produtos</div><div class="metric">${data.produtos.length}</div></div><div class="card"><div class="muted">Pedidos</div><div class="metric">${data.pedidos.length}</div></div><div class="card"><div class="muted">Viagens</div><div class="metric">${data.viagens.length}</div></div></div><div style="height:14px"></div><div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><h3>Pedidos recentes</h3><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th></tr></thead><tbody>${data.pedidos.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,8).map(o=>`<tr><td>${esc(o.numero)}</td><td>${esc(o.cliente_nome)}</td><td>${money(o.total)}</td><td><span class="badge">${esc(o.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum pedido.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Estoque baixo</h3><div class="metric">${low}</div><div class="muted">produtos no limite mínimo</div></div></div>`}
function clientesHtml(){return `${listHeader("openCliente()","Novo cliente")}<div class="table-wrap"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Cidade</th><th></th></tr></thead><tbody>${data.clientes.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.whatsapp)}</td><td>${esc(c.cidade)}</td><td><button class="secondary" onclick="openCliente('${c.id}')">Editar</button> <button class="danger" onclick="del('clientes','${c.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum cliente.</td></tr>'}</tbody></table></div>`}
function produtosHtml(){return `${listHeader("openProduto()","Novo produto")}<div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Custo</th><th>Venda</th><th>Estoque</th><th></th></tr></thead><tbody>${data.produtos.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.sku)}</td><td>${money(p.custo)}</td><td>${money(p.preco_venda)}</td><td>${Number(p.estoque||0)}</td><td><button class="secondary" onclick="openProduto('${p.id}')">Editar</button> <button class="danger" onclick="del('produtos','${p.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum produto.</td></tr>'}</tbody></table></div>`}
function pedidosHtml(){return `${listHeader("openPedido()","Novo pedido")}<div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Canal</th><th>Total</th><th>Pagamento</th><th>Viagem</th><th>Status</th><th></th></tr></thead><tbody>${data.pedidos.map(o=>`<tr><td>${esc(o.numero)}</td><td>${esc(o.cliente_nome)}</td><td>${esc(o.origem)}</td><td>${money(o.total)}</td><td>${esc(o.meio_pagamento)}</td><td>${esc(data.viagens.find(v=>v.id===o.viagem_id)?.nome||'')}</td><td><span class="badge">${esc(o.status)}</span></td><td><button class="secondary" onclick="openPedido('${o.id}')">Editar</button> <button class="secondary" onclick="gerarPdfPedido('${o.id}')">PDF</button> <button class="danger" onclick="del('pedidos','${o.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum pedido.</td></tr>'}</tbody></table></div>`}
function viagensHtml(){return `${listHeader("openViagem()","Nova viagem")}<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Destino</th><th>Saída</th><th>Retorno</th><th>Status</th><th>Orçamento</th><th></th></tr></thead><tbody>${data.viagens.map(v=>`<tr><td>${esc(v.nome)}</td><td>${esc(v.destino)}</td><td>${esc(v.data_saida||'')}</td><td>${esc(v.data_retorno||'')}</td><td><span class="badge">${esc(v.status)}</span></td><td>${money(v.orcamento)}</td><td><button class="secondary" onclick="openViagem('${v.id}')">Editar</button> <button class="secondary" onclick="abrirListaCompra('${v.id}')">🛒 Compras</button> <button class="danger" onclick="del('viagens','${v.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma viagem.</td></tr>'}</tbody></table></div>`}
function fechamentoHtml(){const ym=new Date().toISOString().slice(0,7);return `<div class="card"><div class="toolbar"><div><h3 style="margin:0">Fechamento de pedidos</h3><div class="small">Cancelados não entram.</div></div><input id="fechMes" type="month" value="${ym}" onchange="renderFechamento()"></div><div id="fechamentoResumo"></div></div><script>setTimeout(renderFechamento,0)<\/script>`}
function renderFechamento(){const m=document.getElementById('fechMes')?.value;if(!m)return;const arr=data.pedidos.filter(o=>String(o.created_at||'').slice(0,7)===m&&String(o.status||'').toLowerCase()!=='cancelado');const total=arr.reduce((s,o)=>s+Number(o.total||0),0);const canais={},pag={};for(const o of arr){canais[o.origem||'Outro']=(canais[o.origem||'Outro']||0)+Number(o.total||0);pag[o.meio_pagamento||'Outro']=(pag[o.meio_pagamento||'Outro']||0)+Number(o.total||0)}const rows=x=>Object.entries(x).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Sem dados.</td></tr>';document.getElementById('fechamentoResumo').innerHTML=`<div class="grid"><div class="card"><div class="muted">Pedidos</div><div class="metric">${arr.length}</div></div><div class="card"><div class="muted">Concluídos</div><div class="metric">${arr.filter(o=>String(o.status).toLowerCase()==='concluído').length}</div></div><div class="card"><div class="muted">Vendas</div><div class="metric">${money(total)}</div></div><div class="card"><div class="muted">Ticket</div><div class="metric">${money(arr.length?total/arr.length:0)}</div></div></div><div style="height:14px"></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Por canal</h3><div class="table-wrap"><table><thead><tr><th>Canal</th><th>Total</th></tr></thead><tbody>${rows(canais)}</tbody></table></div></div><div class="card"><h3>Por pagamento</h3><div class="table-wrap"><table><thead><tr><th>Pagamento</th><th>Total</th></tr></thead><tbody>${rows(pag)}</tbody></table></div></div></div><div class="form-actions" style="position:static"><button class="secondary" onclick="window.print()">Imprimir / PDF</button></div>`}

function filterTable(){const q=(document.getElementById('search')?.value||'').toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}

function openCliente(id){const c=data.clientes.find(x=>x.id===id)||{};openModal(id?'Editar cliente':'Novo cliente',`<div class="form-grid"><div class="field"><label>Nome</label><input id="f_nome" value="${esc(c.nome)}"></div><div class="field"><label>WhatsApp</label><input id="f_whatsapp" value="${esc(c.whatsapp)}"></div><div class="field"><label>Cidade</label><input id="f_cidade" value="${esc(c.cidade)}"></div><div class="field"><label>Estado</label><input id="f_estado" value="${esc(c.estado)}"></div><div class="field full"><label>Observações</label><textarea id="f_obs">${esc(c.observacoes)}</textarea></div></div><div class="form-actions"><button class="primary" onclick="saveCliente('${id||''}')">Salvar</button></div>`)}
function saveCliente(id){const r={id:id||uid(),nome:f_nome.value.trim(),whatsapp:f_whatsapp.value.trim(),cidade:f_cidade.value.trim(),estado:f_estado.value.trim(),observacoes:f_obs.value.trim()};if(!r.nome)return alert('Informe o nome.');localUp('clientes',r);closeModal();render()}
function openProduto(id){const p=data.produtos.find(x=>x.id===id)||{};openModal(id?'Editar produto':'Novo produto',`<div class="form-grid"><div class="field"><label>Nome</label><input id="f_nome" value="${esc(p.nome)}"></div><div class="field"><label>SKU</label><input id="f_sku" value="${esc(p.sku)}"></div><div class="field"><label>Categoria</label><input id="f_cat" value="${esc(p.categoria)}"></div><div class="field"><label>Marca</label><input id="f_marca" value="${esc(p.marca)}"></div><div class="field"><label>Custo</label><input id="f_custo" type="number" step="0.01" value="${Number(p.custo||0)}"></div><div class="field"><label>Preço de venda</label><input id="f_venda" type="number" step="0.01" value="${Number(p.preco_venda||0)}"></div><div class="field"><label>Estoque</label><input id="f_estoque" type="number" value="${Number(p.estoque||0)}"></div><div class="field"><label>Estoque mínimo</label><input id="f_min" type="number" value="${Number(p.estoque_minimo||0)}"></div><div class="field full"><label>Descrição</label><textarea id="f_desc">${esc(p.descricao)}</textarea></div></div><div class="form-actions"><button class="primary" onclick="saveProduto('${id||''}')">Salvar</button></div>`)}
function saveProduto(id){const r={id:id||uid(),nome:f_nome.value.trim(),sku:f_sku.value.trim()||('PROD-'+Date.now()),categoria:f_cat.value.trim(),marca:f_marca.value.trim(),custo:Number(f_custo.value||0),preco_venda:Number(f_venda.value||0),estoque:Number(f_estoque.value||0),estoque_minimo:Number(f_min.value||0),descricao:f_desc.value.trim(),ativo:true};if(!r.nome)return alert('Informe o produto.');localUp('produtos',r);closeModal();render()}

function renderItens(){return tempItems.length?`<div class="table-wrap"><table style="min-width:560px"><thead><tr><th>Produto</th><th>Preço</th><th>Qtd.</th><th>Subtotal</th><th></th></tr></thead><tbody>${tempItems.map((it,i)=>`<tr><td><b>${esc(it.name)}</b><div class="small">${esc(it.sku)}</div></td><td><input type="number" step="0.01" value="${Number(it.price||0)}" onchange="itemChange(${i},'price',this.value)" style="width:100px"></td><td><input type="number" min="1" value="${Number(it.qty||1)}" onchange="itemChange(${i},'qty',this.value)" style="width:70px"></td><td>${money(Number(it.price||0)*Number(it.qty||1))}</td><td><button class="danger" onclick="itemRemove(${i})">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="small" style="border:1px dashed var(--line);padding:10px;border-radius:8px">Nenhum produto adicionado.</div>'}
function updateItemsUI(){document.getElementById('pedidoItensBox').innerHTML=renderItens();document.getElementById('f_total').value=calcularTotal().toFixed(2)}
function calcularTotal(){return tempItems.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0)}
function itemChange(i,k,v){tempItems[i][k]=k==='price'?Number(v||0):Math.max(1,Number(v||1));updateItemsUI()}
function itemRemove(i){tempItems.splice(i,1);updateItemsUI()}
function filtrarProdutosPedido(){const box=document.getElementById('produtoSugestoes'),inp=document.getElementById('f_produto_busca');if(!box||!inp)return;const q=inp.value.toLowerCase().trim();const rows=data.produtos.filter(p=>!q||[p.nome,p.sku,p.categoria,p.marca].join(' ').toLowerCase().includes(q)).slice(0,15);box.innerHTML=rows.map(p=>`<button type="button" class="secondary" style="display:flex;width:100%;justify-content:space-between;margin:3px 0;text-align:left" onclick="addProdutoPedido('${p.id}')"><span><b>${esc(p.nome)}</b><div class="small">${esc(p.sku||'')}</div></span><span>${money(p.preco_venda)}</span></button>`).join('')||'<div class="small" style="padding:8px">Nenhum produto encontrado.</div>';box.style.display='block'}
function addProdutoPedido(id){const p=data.produtos.find(x=>x.id===id);if(!p)return;const x=tempItems.find(i=>i.productId===p.id);if(x)x.qty=Number(x.qty||1)+1;else tempItems.push({productId:p.id,name:p.nome,sku:p.sku||'',qty:1,price:Number(p.preco_venda||0),cost:Number(p.custo||0)});document.getElementById('f_produto_busca').value='';document.getElementById('produtoSugestoes').style.display='none';updateItemsUI()}
function filtrarClientesPedido(){const box=document.getElementById('clienteSugestoes'),inp=document.getElementById('f_cliente_busca');if(!box||!inp)return;const q=inp.value.toLowerCase().trim();const rows=data.clientes.filter(c=>!q||[c.nome,c.whatsapp,c.cidade].join(' ').toLowerCase().includes(q)).slice(0,12);box.innerHTML=rows.map(c=>`<button type="button" class="secondary" style="display:block;width:100%;text-align:left;margin:3px 0" onclick="selectCliente('${c.id}')"><b>${esc(c.nome)}</b><div class="small">${esc(c.whatsapp||'')} ${esc(c.cidade||'')}</div></button>`).join('')||'<div class="small" style="padding:8px">Nenhum cliente encontrado.</div>';box.style.display='block'}
function selectCliente(id){const c=data.clientes.find(x=>x.id===id);if(!c)return;f_cliente.value=c.id;f_cliente_busca.value=c.nome;f_whatsapp.value=c.whatsapp||'';clienteSugestoes.style.display='none'}

function openPedido(id){const o=data.pedidos.find(x=>x.id===id)||{};const c=data.clientes.find(x=>x.id===o.cliente_id);tempItems=(o.productItems||[]).map(x=>({...x}));openModal(id?'Editar pedido':'Novo pedido',`<div class="form-grid"><div class="field"><label>Número</label><input id="f_numero" value="${esc(o.numero||'')}"></div><div class="field full"><label>Cliente</label><div style="display:flex;gap:8px"><input id="f_cliente_busca" value="${esc(c?.nome||o.cliente_nome||'')}" placeholder="🔎 Nome ou WhatsApp" oninput="filtrarClientesPedido()" style="flex:1"><button type="button" class="secondary" onclick="filtrarClientesPedido()">🔎</button></div><input id="f_cliente" type="hidden" value="${esc(o.cliente_id||'')}"><div id="clienteSugestoes" class="card" style="display:none;padding:6px;margin-top:6px"></div></div><div class="field full"><label>Adicionar produto</label><div style="display:flex;gap:8px"><input id="f_produto_busca" placeholder="🔎 Nome ou SKU do produto" oninput="filtrarProdutosPedido()" style="flex:1"><button type="button" class="secondary" onclick="filtrarProdutosPedido()">🔎 Procurar produto</button></div><div id="produtoSugestoes" class="card" style="display:none;padding:6px;margin-top:6px;max-height:210px;overflow:auto"></div><div id="pedidoItensBox" style="margin-top:10px"></div></div><div class="field"><label>Canal</label><select id="f_origem"><option>WhatsApp</option><option>Mercado Livre</option><option>Marketplace</option><option>Venda Direta</option><option>Instagram</option><option>Outro</option></select></div><div class="field"><label>Status</label><select id="f_status"><option>Novo</option><option>Aguardando compra</option><option>Em separação</option><option>Concluído</option><option>Cancelado</option></select></div><div class="field"><label>Total</label><input id="f_total" type="number" step="0.01" readonly value="${Number(o.total||calcularTotal())}"></div><div class="field"><label>Pagamento</label><select id="f_pagamento"><option>Dinheiro</option><option>Pix</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></div><div class="field"><label>WhatsApp</label><input id="f_whatsapp" value="${esc(o.whatsapp||c?.whatsapp||'')}"></div><div class="field"><label>Viagem vinculada</label><select id="f_viagem"><option value="">Sem viagem</option>${data.viagens.map(v=>`<option value="${v.id}" ${v.id===o.viagem_id?'selected':''}>${esc(v.nome)}</option>`).join('')}</select></div><div class="field full"><label>Observações</label><textarea id="f_obs">${esc(o.observacoes||'')}</textarea></div></div><div class="form-actions"><button class="secondary" onclick="gerarPdfPedidoTemporario('${id||''}')">Nota PDF</button><button class="secondary" onclick="concluirPedido('${id||''}')">Concluir pedido</button><button class="primary" onclick="savePedido('${id||''}')">Salvar</button></div>`);f_origem.value=o.origem||'WhatsApp';f_status.value=o.status||'Novo';f_pagamento.value=o.meio_pagamento||'Dinheiro';updateItemsUI()}
function savePedido(id){const old=data.pedidos.find(x=>x.id===id);const c=data.clientes.find(x=>x.id===f_cliente.value);const r={id:id||uid(),numero:f_numero.value.trim()||('PED-'+Date.now()),cliente_id:c?.id||null,cliente_nome:c?.nome||f_cliente_busca.value.trim(),whatsapp:f_whatsapp.value.trim(),origem:f_origem.value,status:f_status.value,total:calcularTotal(),meio_pagamento:f_pagamento.value,viagem_id:f_viagem.value||null,observacoes:f_obs.value.trim(),productItems:tempItems.map(x=>({...x})),created_at:old?.created_at||now(),updated_at:now()};localUp('pedidos',r);queue=queue.filter(x=>!(x.table==='pedido_itens'&&x.row?.pedido_id===r.id));for(const it of r.productItems)queue.push({op:'upsert',table:'pedido_itens',row:{id:it.itemId||uid(),pedido_id:r.id,produto_id:it.productId||null,produto_nome:it.name,sku:it.sku||null,quantidade:Number(it.qty||1),preco_unitario:Number(it.price||0),custo_unitario:Number(it.cost||0),desconto:0,subtotal:Number(it.price||0)*Number(it.qty||1)}});persist();tempItems=[];closeModal();render()}
function concluirPedido(id){if(!id){savePedido('');setTimeout(()=>{const p=data.pedidos[0];if(p){p.status='Concluído';p.updated_at=now();localUp('pedidos',p)}},20);return}const p=data.pedidos.find(x=>x.id===id);if(!p)return;p.status='Concluído';p.updated_at=now();localUp('pedidos',p);closeModal();render()}

function getCompras(viagemId){const m=new Map();for(const o of data.pedidos.filter(x=>x.viagem_id===viagemId&&String(x.status).toLowerCase()!=='cancelado'))for(const it of o.productItems||[]){const k=it.productId||it.sku||it.name;const z=m.get(k)||{name:it.name,sku:it.sku||'',qty:0,pedidos:[]};z.qty+=Number(it.qty||1);if(o.numero)z.pedidos.push(o.numero);m.set(k,z)}return [...m.values()]}
function openViagem(id){const v=data.viagens.find(x=>x.id===id)||{};const comp=id?getCompras(id):[];openModal(id?'Editar viagem':'Nova viagem',`<div class="form-grid"><div class="field"><label>Nome</label><input id="f_nome" value="${esc(v.nome)}"></div><div class="field"><label>Destino</label><input id="f_destino" value="${esc(v.destino)}"></div><div class="field"><label>Saída</label><input id="f_saida" type="date" value="${esc(v.data_saida||'')}"></div><div class="field"><label>Retorno</label><input id="f_retorno" type="date" value="${esc(v.data_retorno||'')}"></div><div class="field"><label>Status</label><select id="f_status"><option>Planejada</option><option>Em andamento</option><option>Concluída</option><option>Cancelada</option></select></div><div class="field"><label>Orçamento</label><input id="f_orcamento" type="number" step="0.01" value="${Number(v.orcamento||0)}"></div><div class="field full"><label>Produtos que devem ser comprados</label>${comp.length?`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Qtd.</th><th>Pedidos</th></tr></thead><tbody>${comp.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td><b>${x.qty}</b></td><td>${esc(x.pedidos.join(', '))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="small">Vincule pedidos a esta viagem para gerar a lista de compras.</div>'}</div><div class="field full"><label>Observações</label><textarea id="f_obs">${esc(v.observacoes||'')}</textarea></div></div><div class="form-actions"><button class="secondary" onclick="window.print()">Imprimir lista</button><button class="primary" onclick="saveViagem('${id||''}')">Salvar</button></div>`);f_status.value=v.status||'Planejada'}
function abrirListaCompra(id){const v=data.viagens.find(x=>x.id===id),comp=getCompras(id);openModal(`Lista de compras — ${v?.nome||''}`,comp.length?`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Qtd.</th><th>Pedidos</th></tr></thead><tbody>${comp.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td><b>${x.qty}</b></td><td>${esc(x.pedidos.join(', '))}</td></tr>`).join('')}</tbody></table></div><div class="form-actions"><button class="secondary" onclick="window.print()">Imprimir</button></div>`:'<div class="empty">Nenhum produto para comprar nesta viagem.</div>')}
function saveViagem(id){const old=data.viagens.find(x=>x.id===id);const r={id:id||uid(),nome:f_nome.value.trim(),destino:f_destino.value.trim(),data_saida:f_saida.value||null,data_retorno:f_retorno.value||null,status:f_status.value,orcamento:Number(f_orcamento.value||0),observacoes:f_obs.value.trim(),updated_at:now(),created_at:old?.created_at||now()};if(!r.nome)return alert('Informe o nome da viagem.');localUp('viagens',r);closeModal();render()}

function gerarPdfPedidoTemporario(id){if(!id)return alert('Salve o pedido primeiro.');gerarPdfPedido(id)}
function gerarPdfPedido(id){const o=data.pedidos.find(x=>x.id===id);if(!o)return;const c=data.clientes.find(x=>x.id===o.cliente_id);const w=window.open('','_blank','width=800,height=900');w.document.write(`<html lang="pt-BR"><head><meta charset="utf-8"><title>Nota ${esc(o.numero)}</title><style>body{font-family:Arial;color:#5c4036;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eadbd3;text-align:left}.logo{width:90px;height:90px;border-radius:50%;object-fit:cover}.total{text-align:right;font-size:22px;font-weight:bold;margin-top:18px}</style></head><body><div style="display:flex;gap:15px;align-items:center"><img class="logo" src="${document.querySelector('.brand-logo img')?.src||''}"><div><h1>Bellas Imports</h1><div>NOTA / PEDIDO ${esc(o.numero)}</div></div></div><h2>Cliente</h2><p>${esc(o.cliente_nome||c?.nome||'—')} — ${esc(o.whatsapp||c?.whatsapp||'')}</p><p><b>Canal:</b> ${esc(o.origem)} &nbsp; <b>Pagamento:</b> ${esc(o.meio_pagamento)}</p><p><b>Viagem:</b> ${esc(data.viagens.find(v=>v.id===o.viagem_id)?.nome||'—')}</p><h2>Itens</h2>${o.productItems?.length?`<table><tr><th>Produto</th><th>Qtd.</th><th>Unitário</th><th>Subtotal</th></tr>${o.productItems.map(it=>`<tr><td>${esc(it.name)}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(Number(it.price||0)*Number(it.qty||1))}</td></tr>`).join('')}</table>`:`<p>${esc(o.observacoes||'—')}</p>`}<div class="total">TOTAL: ${money(o.total)}</div><p style="margin-top:40px">Bellas Imports — documento gerado pelo ERP.</p></body></html>`);w.document.close();setTimeout(()=>w.print(),400)}

function localUp(table,row){data[table]=data[table]||[];const i=data[table].findIndex(x=>x.id===row.id);if(i>=0)data[table][i]={...data[table][i],...row};else data[table].unshift(row);const key=`upsert|${table}|${row.id}`;queue=queue.filter(x=>`${x.op}|${x.table}|${x.row?.id||''}`!==key);queue.push({op:'upsert',table,row});persist();if(navigator.onLine)setTimeout(syncNow,50)}
async function del(table,id){if(!confirm('Excluir este registro?'))return;data[table]=data[table].filter(x=>x.id!==id);queue=queue.filter(x=>!(x.table===table&&x.row?.id===id));queue.push({op:'delete',table,row:{id}});persist();render();if(navigator.onLine)syncNow()}

async function rpcWrite(table,row){
 let rpc, params;
 if(table==='clientes'){rpc='erp_salvar_cliente';params={p_id:row.id,p_nome:row.nome,p_whatsapp:row.whatsapp||null,p_telefone:null,p_email:null,p_cidade:row.cidade||null,p_estado:row.estado||null,p_endereco:null,p_observacoes:row.observacoes||null}}
 else if(table==='produtos'){rpc='erp_salvar_produto';params={p_id:row.id,p_sku:row.sku,p_nome:row.nome,p_categoria:row.categoria||null,p_marca:row.marca||null,p_descricao:row.descricao||null,p_custo:Number(row.custo||0),p_preco_venda:Number(row.preco_venda||0),p_estoque:Number(row.estoque||0),p_estoque_minimo:Number(row.estoque_minimo||0),p_canais:[],p_ativo:true}}
 else if(table==='viagens'){rpc='erp_salvar_viagem';params={p_id:row.id,p_nome:row.nome,p_destino:row.destino||null,p_data_saida:row.data_saida||null,p_data_retorno:row.data_retorno||null,p_status:row.status||'Planejada',p_orcamento:Number(row.orcamento||0),p_observacoes:row.observacoes||null}}
 else if(table==='pedidos'){rpc='erp_salvar_pedido';params={p_id:row.id,p_cliente_id:row.cliente_id||null,p_cliente_nome:row.cliente_nome||null,p_whatsapp:row.whatsapp||null,p_viagem_id:row.viagem_id||null,p_numero:row.numero,p_origem:row.origem,p_status:row.status,p_total:Number(row.total||0),p_meio_pagamento:row.meio_pagamento,p_observacoes:row.observacoes||null,p_itens:(row.productItems||[]).map(it=>({produto_id:it.productId||null,produto_nome:it.name||'',sku:it.sku||null,quantidade:Number(it.qty||1),preco_unitario:Number(it.price||0),custo_unitario:Number(it.cost||0),desconto:0}))}}
 else if(table==='pedido_itens')return true;
 else return false;
 const {error}=await sb.rpc(rpc,params);if(error)throw new Error(`${table}: ${error.message}`);return true
}
async function rpcDelete(table,id){const names={clientes:'erp_excluir_cliente',produtos:'erp_excluir_produto',viagens:'erp_excluir_viagem',pedidos:'erp_excluir_pedido'};if(table==='pedido_itens')return true;const rpc=names[table];if(!rpc){const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error;return}const {error}=await sb.rpc(rpc,{p_id:id});if(error)throw new Error(`${table}: ${error.message}`)}
async function processQueue(){while(queue.length){const op=queue[0];let ok=false,last=null;for(let i=0;i<3&&!ok;i++){try{if(op.op==='upsert')await rpcWrite(op.table,op.row);else await rpcDelete(op.table,op.row.id);ok=true}catch(e){last=e;if(i<2)await new Promise(r=>setTimeout(r,600*(i+1)))}}if(!ok)throw last;queue.shift();persist()}}
async function pullAll(){const remote={};for(const t of ['clientes','produtos','pedidos','viagens']){const {data:r,error}=await sb.from(t).select('*');if(error)throw new Error(`${t}: ${error.message}`);remote[t]=r||[]}const {data:pis,error:pie}=await sb.from('pedido_itens').select('*');if(pie)throw new Error(`pedido_itens: ${pie.message}`);const by={};for(const pi of pis||[])(by[pi.pedido_id]||=[]).push({itemId:pi.id,productId:pi.produto_id,name:pi.produto_nome||'',sku:pi.sku||'',qty:Number(pi.quantidade||1),price:Number(pi.preco_unitario||0),cost:Number(pi.custo_unitario||0)});remote.pedidos=remote.pedidos.map(o=>({...o,productItems:by[o.id]||[]}));for(const t of ['clientes','produtos','pedidos','viagens'])data[t]=remote[t];data.pedido_itens=pis||[];persist();render()}
let syncing=false;
async function syncNow(){if(syncing)return;if(!navigator.onLine){setStatus('Offline',true);return}syncing=true;const n=queue.length;setStatus(n?`Sincronizando • ${n} pendência(s)`:'Sincronizando...');try{const {data:a,error}=await sb.auth.getSession();if(error)throw error;if(!a?.session)throw new Error('Sessão expirada.');await processQueue();await pullAll();setStatus(`Online • sincronizado • ${n} pendência(s)`)}catch(e){persist();console.error(e);setStatus('Erro: '+(e.message||e),true)}finally{syncing=false}}
async function testSync(){try{const {data:a,error}=await sb.auth.getSession();if(error)throw error;if(!a?.session)throw new Error('Não autenticado.');const {data,error:e}=await sb.from('produtos').select('id').limit(1);if(e)throw e;setStatus('Supabase OK')}catch(e){setStatus('Teste falhou: '+(e.message||e),true)}}

window.addEventListener('online',syncNow);window.addEventListener('offline',()=>setStatus('Offline',true));
(async()=>{const {data:a}=await sb.auth.getSession();if(a?.session)enter();})();
</script>
