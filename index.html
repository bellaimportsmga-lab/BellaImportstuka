<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6f4b3e">
<link rel="manifest" href="manifest.json">
<title>Bellas Imports — ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8f1ec;--card:#fff;--ink:#5c4036;--muted:#92776b;--line:#eadbd3;--accent:#b47a5d;--dark:#6f4b3e;--danger:#b4534c;--ok:#6b8c73}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#6f4b3e,#374151)}
.login-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 60px #0005}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.brand-logo{width:52px;height:52px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:#f9e9df}.brand-logo img{width:100%;height:100%;display:block;object-fit:cover}
.login-card h1{margin:24px 0 8px}.login-card p{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline:none}
.field textarea{min-height:90px;resize:vertical}
.primary{border:0;background:var(--dark);color:#fff;border-radius:10px;padding:11px 15px;font-weight:700}
.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700}
.danger{border:0;background:#fee2e2;color:#991b1b;border-radius:9px;padding:8px 10px}
.small{font-size:12px;color:var(--muted)}
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:235px;background:#6f4b3e;color:#fff;padding:18px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}
.sidebar .logo{margin-bottom:22px}.sidebar nav{display:grid;gap:6px}
.nav-btn{border:0;background:transparent;color:#d1d5db;padding:11px 12px;text-align:left;border-radius:9px}
.nav-btn:hover,.nav-btn.active{background:#5c4036;color:#fff}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}
.content{margin-left:235px;flex:1;padding:22px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.topbar h2{margin:0;font-size:24px}.top-actions{display:flex;gap:8px;align-items:center}
.status{font-size:12px;padding:7px 9px;border-radius:999px;background:#ecfdf5;color:#166534}
.status.off{background:#fff7ed;color:#9a3412}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.metric{font-size:26px;font-weight:800;margin-top:4px}
.muted{color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{max-width:320px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{background:#fafafa;color:#374151}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:700}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal.show{display:flex}.modal-card{width:min(700px,100%);background:#fff;border-radius:16px;padding:20px;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;position:sticky;bottom:0;background:#fff;padding:12px 0 2px;border-top:1px solid var(--line)}
.empty{padding:32px;text-align:center;color:var(--muted)}
.mobile-menu{display:none}
@media(max-width:900px){.back-btn{padding:8px 10px;white-space:nowrap;font-size:12px}
.sidebar{transform:translateX(-100%);transition:.2s;z-index:30}.sidebar.open{transform:translateX(0)}
.content{margin-left:0;padding:16px;padding-bottom:78px}
.mobile-menu{display:block;border:0;background:#6f4b3e;color:#fff;border-radius:9px;padding:9px 11px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.topbar{align-items:flex-start}
}
@media(max-width:600px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
.bottom-sync{position:fixed;left:0;right:0;bottom:0;background:#6f4b3e;color:#fff;padding:10px 14px;display:none;z-index:40}
@media(max-width:900px){.bottom-sync{display:flex;justify-content:space-between;align-items:center}}
.brand-logo{width:52px;height:52px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:#f9e9df}.brand-logo img{width:100%;height:100%;display:block;object-fit:cover}
</style>
<style>
@media print{
 body{background:#fff!important}
 .sidebar,.topbar,.bottom-sync,.mobile-menu,.form-actions,button{display:none!important}
 .content{margin:0!important;padding:0!important}
 .card{border:0!important;box-shadow:none!important}
}
@media(max-width:600px){
 .modal{padding:8px}
 .modal-card{max-height:94vh;padding:14px}
 .form-actions{flex-wrap:wrap}
 .form-actions button{flex:1 1 100%}
}
</style>
</head>

<script>
const SUPABASE_URL='https://dbckbqpvalfoolckiyne.supabase.co';
const SUPABASE_KEY='sb_publishable_9FMuQuSDNY_RwZgKrCCaIw_2J_ysKki';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const TABLES=['clientes','produtos','pedidos','viagens'];
const CACHE_KEY='bellas_simple_cache_v1';
const QUEUE_KEY='bellas_simple_queue_v1';
const getCache=()=>{try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')}catch{return {}}};
const saveCache=x=>localStorage.setItem(CACHE_KEY,JSON.stringify(x));
const getQueue=()=>{try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch{return []}};
const saveQueue=x=>localStorage.setItem(QUEUE_KEY,JSON.stringify(x));
let data=getCache();
for(const t of TABLES) if(!Array.isArray(data[t])) data[t]=[];
let queue=getQueue();
let page='dashboard';
let pageHistory=['dashboard'];
function voltarPagina(){
  if(pageHistory.length>1){
    pageHistory.pop();
    page=pageHistory[pageHistory.length-1];
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    render();
  }else{
    page='dashboard';
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page==='dashboard'));
    render();
  }
}


function uid(){return crypto.randomUUID()}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function now(){return new Date().toISOString()}
function setStatus(text,off=false){document.getElementById('conn').textContent=text;document.getElementById('conn').className='status'+(off?' off':'');document.getElementById('mobileSyncStatus').textContent=text}
function persist(){saveCache(data);saveQueue(queue)}
function q(op,table,row){queue.push({op,table,row});persist();if(navigator.onLine) setTimeout(syncNow,50)}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim(), pass=document.getElementById('loginPass').value;
  const msg=document.getElementById('loginMsg');msg.textContent='A entrar...';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){msg.textContent=error.message;return}
  await enter();
}
async function enter(){
  document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
  render(); if(navigator.onLine) await syncNow();
}
async function logout(){await sb.auth.signOut();location.reload()}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function go(p){
  if(p!==page) pageHistory.push(p);
  page=p;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  toggleMenu();
  render();
}
function render(){
  const titles={dashboard:'Dashboard',clientes:'Clientes',produtos:'Produtos',pedidos:'Pedidos',viagens:'Viagens',fechamento:'Fechamento do mês'};
  document.getElementById('pageTitle').textContent=titles[page];
  const el=document.getElementById('page');
  if(page==='dashboard')el.innerHTML=dashboardHtml();
  if(page==='clientes')el.innerHTML=clientesHtml();
  if(page==='produtos')el.innerHTML=produtosHtml();
  if(page==='pedidos')el.innerHTML=pedidosHtml();
  if(page==='viagens')el.innerHTML=viagensHtml();
  if(page==='fechamento'){el.innerHTML=fechamentoHtml();setTimeout(renderFechamento,0);}
}
function dashboardHtml(){
  const low=data.produtos.filter(p=>Number(p.estoque||0)<=Number(p.estoque_minimo||0)).length;
  return `<div class="grid">
    <div class="card"><div class="muted">Clientes</div><div class="metric">${data.clientes.length}</div></div>
    <div class="card"><div class="muted">Produtos</div><div class="metric">${data.produtos.length}</div></div>
    <div class="card"><div class="muted">Pedidos</div><div class="metric">${data.pedidos.length}</div></div>
    <div class="card"><div class="muted">Viagens</div><div class="metric">${data.viagens.length}</div></div>
  </div>
  <div style="height:14px"></div>
  <div class="grid" style="grid-template-columns:2fr 1fr">
    <div class="card"><h3>Pedidos recentes</h3>${data.pedidos.length?`<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th></tr></thead><tbody>${data.pedidos.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,8).map(o=>`<tr><td>${esc(o.numero||'—')}</td><td>${esc(o.cliente_nome||'—')}</td><td>${money(o.total)}</td><td><span class="badge">${esc(o.status||'Novo')}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum pedido ainda.</div>`}</div>
    <div class="card"><h3>Estoque baixo</h3><div style="font-size:34px;font-weight:800">${low}</div><div class="muted">produtos no limite mínimo</div></div>
  </div>`;
}
function listHeader(btn,label,search='') {
  return `<div class="toolbar"><button class="primary" onclick="${btn}">+ ${label}</button>${search?`<input id="search" placeholder="Pesquisar..." oninput="filterTable()">`:''}</div>`;
}
function clientesHtml(){
  return `${listHeader("openCliente()","Novo cliente","search")}
  <div class="table-wrap"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Cidade</th><th>Ações</th></tr></thead><tbody id="rows">${data.clientes.length?data.clientes.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.whatsapp||'')}</td><td>${esc(c.cidade||'')}</td><td><button class="secondary" onclick="openCliente('${c.id}')">Editar</button> <button class="danger" onclick="del('clientes','${c.id}')">Excluir</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">Nenhum cliente.</td></tr>`}</tbody></table></div>`;
}
function produtosHtml(){
  return `${listHeader("openProduto()","Novo produto","search")}
  <div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Custo</th><th>Venda</th><th>Estoque</th><th>Ações</th></tr></thead><tbody id="rows">${data.produtos.length?data.produtos.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.sku||'')}</td><td>${money(p.custo)}</td><td>${money(p.preco_venda)}</td><td>${Number(p.estoque||0)}</td><td><button class="secondary" onclick="openProduto('${p.id}')">Editar</button> <button class="danger" onclick="del('produtos','${p.id}')">Excluir</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum produto.</td></tr>`}</tbody></table></div>`;
}
function pedidosHtml(){
  return `${listHeader("openPedido()","Novo pedido","search")}
  <div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Canal</th><th>Total</th><th>Pagamento</th><th>Status</th><th>Ações</th></tr></thead><tbody>${data.pedidos.length?data.pedidos.map(o=>`<tr><td>${esc(o.numero||'—')}</td><td>${esc(o.cliente_nome||'')}</td><td>${esc(o.origem||'')}</td><td>${money(o.total)}</td><td>${esc(o.meio_pagamento||'')}</td><td><span class="badge">${esc(o.status||'')}</span></td><td><button class="secondary" onclick="openPedido('${o.id}')">Editar</button> <button class="secondary" onclick="gerarPdfPedido('${o.id}')">PDF</button> <button class="danger" onclick="del('pedidos','${o.id}')">Excluir</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Nenhum pedido.</td></tr>`}</tbody></table></div>`;
}
function viagensHtml(){
  return `${listHeader("openViagem()","Nova viagem","search")}
  <div class="table-wrap"><table><thead><tr><th>Nome</th><th>Destino</th><th>Saída</th><th>Retorno</th><th>Status</th><th>Orçamento</th><th>Ações</th></tr></thead><tbody>${data.viagens.length?data.viagens.map(v=>`<tr><td>${esc(v.nome)}</td><td>${esc(v.destino||'')}</td><td>${esc(v.data_saida||'')}</td><td>${esc(v.data_retorno||'')}</td><td><span class="badge">${esc(v.status||'')}</span></td><td>${money(v.orcamento)}</td><td><button class="secondary" onclick="openViagem('${v.id}')">Editar</button> <button class="danger" onclick="del('viagens','${v.id}')">Excluir</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Nenhuma viagem.</td></tr>`}</tbody></table></div>`;
}

function openModal(title,body){document.getElementById('modalCard').innerHTML=`<div class="modal-head"><h3 style="margin:0">${title}</h3><button class="secondary" onclick="closeModal()">Fechar</button></div>${body}`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}

 const c=data.clientes.find(x=>x.id===id)||{};
 openModal(id?'Editar cliente':'Novo cliente',`<div class="form-grid">
  <div class="field"><label>Nome</label><input id="f_nome" value="${esc(c.nome||'')}"></div>
  <div class="field"><label>WhatsApp</label><input id="f_whatsapp" value="${esc(c.whatsapp||'')}"></div>

 </div><div class="form-actions"><button class="primary" onclick="saveCliente('${id||''}')">Salvar</button></div>`);

function saveCliente(id){
 const row={id:id||uid(),nome:document.getElementById('f_nome').value.trim(),whatsapp:document.getElementById('f_whatsapp').value.trim(),cidade:document.getElementById('f_cidade').value.trim(),estado:document.getElementById('f_estado').value.trim(),observacoes:document.getElementById('f_obs').value.trim(),updated_at:now()};
 if(!row.nome)return alert('Informe o nome.');
 upsertLocal('clientes',row);closeModal();render();

 openModal(id?'Editar produto':'Novo produto',`<div class="form-grid">

  <div class="field"><label>SKU</label><input id="f_sku" value="${esc(p.sku||'')}"></div>
  <div class="field"><label>Categoria</label><input id="f_cat" value="${esc(p.categoria||'')}"></div>
  <div class="field"><label>Marca</label><input id="f_marca" value="${esc(p.marca||'')}"></div>
  <div class="field"><label>Custo</label><input id="f_custo" type="number" step="0.01" value="${Number(p.custo||0)}"></div>
  <div class="field"><label>Preço de venda</label><input id="f_venda" type="number" step="0.01" value="${Number(p.preco_venda||0)}"></div>
  <div class="field"><label>Estoque</label><input id="f_estoque" type="number" step="1" value="${Number(p.estoque||0)}"></div>
  <div class="field"><label>Estoque mínimo</label><input id="f_min" type="number" step="1" value="${Number(p.estoque_minimo||0)}"></div>
  <div class="field full"><label>Descrição</label><textarea id="f_desc">${esc(p.descricao||'')}</textarea></div>
 </div><div class="form-actions"><button class="primary" onclick="saveProduto('${id||''}')">Salvar</button></div>`);
}
function saveProduto(id){
 const row={id:id||uid(),nome:document.getElementById('f_nome').value.trim(),sku:document.getElementById('f_sku').value.trim()||('PROD-'+Date.now()),categoria:document.getElementById('f_cat').value.trim(),marca:document.getElementById('f_marca').value.trim(),custo:Number(document.getElementById('f_custo').value||0),preco_venda:Number(document.getElementById('f_venda').value||0),estoque:Number(document.getElementById('f_estoque').value||0),estoque_minimo:Number(document.getElementById('f_min').value||0),descricao:document.getElementById('f_desc').value.trim(),ativo:true,updated_at:now()};
 if(!row.nome)return alert('Informe o produto.');
 upsertLocal('produtos',row);closeModal();render();
}
function openPedido(id){
 const o=data.pedidos.find(x=>x.id===id)||{};
 const selectedClient=data.clientes.find(c=>c.id===o.cliente_id);
 openModal(id?'Editar pedido':'Novo pedido',`<div class="form-grid">
  <div class="field"><label>Número</label><input id="f_numero" value="${esc(o.numero||'')}"></div>
  <div class="field full">
    <label>Cliente</label>
    <div style="display:flex;gap:8px">
      <input id="f_cliente_busca" placeholder="🔎 Digite nome ou WhatsApp do cliente" value="${esc(selectedClient?.nome||'')}" oninput="filtrarClientesPedido()" autocomplete="off" style="flex:1">
      <button type="button" class="secondary" title="Procurar cliente" onclick="filtrarClientesPedido()">🔎</button>
    </div>
    <input type="hidden" id="f_cliente" value="${esc(o.cliente_id||'')}">
    <div id="clienteSugestoes" class="card" style="margin-top:8px;padding:6px;display:none;max-height:180px;overflow:auto"></div>
  </div>
  <div class="field"><label>Canal</label><select id="f_origem"><option>WhatsApp</option><option>Mercado Livre</option><option>Marketplace</option><option>Venda Direta</option><option>Instagram</option><option>Outro</option></select></div>
  <div class="field"><label>Status</label><select id="f_status"><option>Novo</option><option>Aguardando compra</option><option>Em separação</option><option>Concluído</option><option>Cancelado</option></select></div>
  <div class="field"><label>Total</label><input id="f_total" type="number" step="0.01" value="${Number(o.total||0)}"></div>
  <div class="field"><label>Pagamento</label><select id="f_pagamento"><option>Dinheiro</option><option>Pix</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></div>
  <div class="field"><label>WhatsApp</label><input id="f_whatsapp" value="${esc(o.whatsapp||selectedClient?.whatsapp||'')}"></div>
  <div class="field"><label>Viagem</label><select id="f_viagem"><option value="">Sem viagem</option>${data.viagens.map(v=>`<option value="${v.id}" ${o.viagem_id===v.id?'selected':''}>${esc(v.nome)}</option>`).join('')}</select></div>
  <div class="field full"><label>Itens / Observações</label><textarea id="f_obs">${esc(o.observacoes||'')}</textarea></div>
 </div>
 <div class="form-actions">
   <button class="secondary" onclick="gerarPdfPedidoTemporario('${id||''}')">Gerar nota PDF</button>
   <button class="secondary" onclick="concluirPedido('${id||''}')">Concluir pedido</button>
   <button class="primary" onclick="savePedido('${id||''}')">Salvar</button>
 </div>`);
 document.getElementById('f_origem').value=o.origem||'WhatsApp';
 document.getElementById('f_status').value=o.status||'Novo';
 document.getElementById('f_pagamento').value=o.meio_pagamento||'Dinheiro';
}
function filtrarClientesPedido(){
 const box=document.getElementById('clienteSugestoes'), inp=document.getElementById('f_cliente_busca');
 if(!box||!inp)return;
 const q=(inp.value||'').trim().toLowerCase();
 const rows=data.clientes.filter(c=>!q || [c.nome,c.whatsapp,c.cidade].join(' ').toLowerCase().includes(q)).slice(0,12);
 box.innerHTML=rows.length?rows.map(c=>`<button type="button" class="secondary" style="display:block;width:100%;text-align:left;margin:3px 0" onclick="selecionarClientePedido('${c.id}')"><b>${esc(c.nome)}</b><span class="small"> ${esc(c.whatsapp||'')} ${c.cidade?'• '+esc(c.cidade):''}</span></button>`).join(''):'<div class="small" style="padding:8px">Nenhum cliente encontrado.</div>';
 box.style.display='block';
}
function selecionarClientePedido(id){
 const c=data.clientes.find(x=>x.id===id); if(!c)return;
 document.getElementById('f_cliente').value=c.id;
 document.getElementById('f_cliente_busca').value=c.nome;
 document.getElementById('f_whatsapp').value=c.whatsapp||'';
 const box=document.getElementById('clienteSugestoes'); if(box)box.style.display='none';
}
function savePedido(id){
 const clientId=document.getElementById('f_cliente').value||null;
 const client=data.clientes.find(c=>c.id===clientId);
 const row={id:id||uid(),numero:document.getElementById('f_numero').value.trim()||('PED-'+Date.now()),cliente_id:client?.id||null,cliente_nome:client?.nome||document.getElementById('f_cliente_busca').value.trim(),whatsapp:document.getElementById('f_whatsapp').value.trim(),origem:document.getElementById('f_origem').value,status:document.getElementById('f_status').value,total:Number(document.getElementById('f_total').value||0),meio_pagamento:document.getElementById('f_pagamento').value,viagem_id:document.getElementById('f_viagem').value||null,observacoes:document.getElementById('f_obs').value.trim(),created_at:id?(data.pedidos.find(x=>x.id===id)?.created_at||now()):now(),updated_at:now()};
 upsertLocal('pedidos',row);closeModal();render();
}
function concluirPedido(id){
 if(!id){
   savePedido('');
   setTimeout(()=>{const p=data.pedidos[0];if(p){p.status='Concluído';p.updated_at=now();upsertLocal('pedidos',p);render();}},30);
   return;
 }
 const p=data.pedidos.find(x=>x.id===id); if(!p)return;
 p.status='Concluído';p.updated_at=now();upsertLocal('pedidos',p);closeModal();render();
}
function gerarPdfPedidoTemporario(id){
 if(!id){ alert('Salve o pedido primeiro para gerar a nota PDF.'); return; }
 gerarPdfPedido(id);
}
function fechamentoHtml(){
 const today=new Date(), ym=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
 return `<div class="card">
   <div class="toolbar"><div><h3 style="margin:0">Fechamento de pedidos</h3><div class="small">Resumo mensal de vendas. Pedidos cancelados ficam fora.</div></div><input id="fechMes" type="month" value="${ym}" onchange="renderFechamento()"></div>
   <div id="fechamentoResumo"></div>
 </div>`;
}
function renderFechamento(){
 const el=document.getElementById('fechamentoResumo'); if(!el)return;
 const ym=document.getElementById('fechMes')?.value;
 const pedidos=data.pedidos.filter(o=>String(o.created_at||'').slice(0,7)===ym && String(o.status||'').toLowerCase()!=='cancelado');
 const total=pedidos.reduce((s,o)=>s+Number(o.total||0),0);
 const concl=pedidos.filter(o=>String(o.status||'').toLowerCase()==='concluído').length;
 const canais={}, pagamentos={};
 for(const o of pedidos){canais[o.origem||'Outro']=(canais[o.origem||'Outro']||0)+Number(o.total||0);pagamentos[o.meio_pagamento||'Outro']=(pagamentos[o.meio_pagamento||'Outro']||0)+Number(o.total||0)}
 const linhas=(obj)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Sem dados.</td></tr>';
 el.innerHTML=`<div class="grid">
   <div class="card"><div class="muted">Pedidos</div><div class="metric">${pedidos.length}</div></div>
   <div class="card"><div class="muted">Concluídos</div><div class="metric">${concl}</div></div>
   <div class="card"><div class="muted">Vendas do mês</div><div class="metric">${money(total)}</div></div>
   <div class="card"><div class="muted">Ticket médio</div><div class="metric">${money(pedidos.length?total/pedidos.length:0)}</div></div>
 </div>
 <div style="height:14px"></div>
 <div class="grid" style="grid-template-columns:1fr 1fr">
   <div class="card"><h3>Por canal</h3><div class="table-wrap"><table><thead><tr><th>Canal</th><th>Total</th></tr></thead><tbody>${linhas(canais)}</tbody></table></div></div>
   <div class="card"><h3>Por pagamento</h3><div class="table-wrap"><table><thead><tr><th>Pagamento</th><th>Total</th></tr></thead><tbody>${linhas(pagamentos)}</tbody></table></div></div>
 </div>
 <div class="form-actions" style="position:static"><button class="secondary" onclick="imprimirFechamento()">Imprimir / Salvar PDF</button></div>`;
}
function imprimirFechamento(){
 const ym=document.getElementById('fechMes')?.value||'';
 const original=document.title;document.title=`Bellas Imports - Fechamento ${ym}`;
 window.print();setTimeout(()=>document.title=original,1000);
}

 const o=data.pedidos.find(x=>x.id===id); if(!o)return alert('Pedido não encontrado.');
 const c=data.clientes.find(x=>x.id===o.cliente_id);
 const w=window.open('','_blank','width=800,height=900');
 const logo = document.querySelector('.brand-logo img')?.src || '';
 const notas = `
   <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Nota ${esc(o.numero)}</title>
   <style>
    body{font-family:Arial,sans-serif;color:#5c4036;padding:30px;max-width:800px;margin:auto}
    .head{display:flex;align-items:center;gap:15px;border-bottom:2px solid #eadbd3;padding-bottom:15px}
    .head img{width:90px;height:90px;object-fit:cover;border-radius:50%}
    h1{font-size:24px;margin:0}h2{font-size:16px;margin-top:24px}
    table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eadbd3;text-align:left}

    .info{margin-top:10px}.muted{color:#92776b}
    @media print{button{display:none}}
   </style></head><body>
   <div class="head"><img src="${logo}" alt="Bellas Imports"><div><h1>Bellas Imports</h1><div>NOTA / PEDIDO ${esc(o.numero||'')}</div></div></div>
   <h2>Dados do pedido</h2>
   <div class="info"><b>Cliente:</b> ${esc(o.cliente_nome||c?.nome||'—')}</div>
   <div class="info"><b>WhatsApp:</b> ${esc(o.whatsapp||c?.whatsapp||'—')}</div>
   <div class="info"><b>Canal:</b> ${esc(o.origem||'—')} &nbsp; <b>Status:</b> ${esc(o.status||'—')}</div>

   <div style="white-space:pre-wrap;border:1px solid #eadbd3;padding:12px;border-radius:8px">${esc(o.observacoes||'—')}</div>

</body></html>`;

function openViagem(id){
 const v=data.viagens.find(x=>x.id===id)||{};
 openModal(id?'Editar viagem':'Nova viagem',`<div class="form-grid">
  <div class="field"><label>Nome</label><input id="f_nome" value="${esc(v.nome||'')}"></div>
  <div class="field"><label>Destino</label><input id="f_destino" value="${esc(v.destino||'')}"></div>
  <div class="field"><label>Data de saída</label><input id="f_saida" type="date" value="${esc(v.data_saida||'')}"></div>
  <div class="field"><label>Data de retorno</label><input id="f_retorno" type="date" value="${esc(v.data_retorno||'')}"></div>
  <div class="field"><label>Status</label><select id="f_status"><option>Planejada</option><option>Em andamento</option><option>Concluída</option><option>Cancelada</option></select></div>
  <div class="field"><label>Orçamento</label><input id="f_orcamento" type="number" step="0.01" value="${Number(v.orcamento||0)}"></div>
  <div class="field full"><label>Observações</label><textarea id="f_obs">${esc(v.observacoes||'')}</textarea></div>
 </div><div class="form-actions"><button class="primary" onclick="saveViagem('${id||''}')">Salvar</button></div>`);
 document.getElementById('f_status').value=v.status||'Planejada';
}
function saveViagem(id){
 const row={id:id||uid(),nome:document.getElementById('f_nome').value.trim(),destino:document.getElementById('f_destino').value.trim(),data_saida:document.getElementById('f_saida').value||null,data_retorno:document.getElementById('f_retorno').value||null,status:document.getElementById('f_status').value,orcamento:Number(document.getElementById('f_orcamento').value||0),observacoes:document.getElementById('f_obs').value.trim(),updated_at:now()};
 if(!row.nome)return alert('Informe o nome da viagem.');
 upsertLocal('viagens',row);closeModal();render();
}
function upsertLocal(table,row){
 const arr=data[table], i=arr.findIndex(x=>x.id===row.id); if(i>=0)arr[i]=row;else arr.unshift(row); persist();
 q('upsert',table,row);
}
async function del(table,id){
 if(!confirm('Excluir este registro?'))return;
 data[table]=data[table].filter(x=>x.id!==id);persist();q('delete',table,{id});render();
}
async function sendOp(op){
 const t=op.table;
 if(op.op==='upsert'){
   const r=await sb.from(t).upsert(op.row,{onConflict:'id'});
   if(r.error)throw new Error(`${t}: ${r.error.message}`);
 } else {
   const r=await sb.from(t).delete().eq('id',op.row.id);
   if(r.error)throw new Error(`${t}: ${r.error.message}`);
 }
}
async function pullAll(){
 for(const t of TABLES){
   const {data:rows,error}=await sb.from(t).select('*');
   if(error)throw new Error(`${t}: ${error.message}`);
   data[t]=Array.isArray(rows)?rows:[];
 }
 persist();render();
}
let syncing=false;
async function syncNow(){
 if(syncing)return;
 if(!navigator.onLine){setStatus('Offline',true);return}
 syncing=true;setStatus('Sincronizando...');
 try{
   const {data:auth,error:ae}=await sb.auth.getSession(); if(ae)throw ae; if(!auth.session)throw new Error('Sessão expirada.');
   let tries=0;
   while(queue.length){
     const op=queue[0];
     let ok=false,last=null;
     for(let i=0;i<3&&!ok;i++){try{await sendOp(op);ok=true}catch(e){last=e;await new Promise(r=>setTimeout(r,500*(i+1)))}}
     if(!ok)throw last;
     queue.shift();saveQueue(queue);tries++;
   }
   await pullAll();
   setStatus(`Online • sincronizado • ${tries} pendência(s) enviada(s)`);
 }catch(e){
   console.error(e);setStatus('Erro: '+(e.message||e),true);
 }finally{syncing=false}
}
window.addEventListener('online',()=>syncNow());
window.addEventListener('offline',()=>setStatus('Offline',true));
(async()=>{const {data:auth}=await sb.auth.getSession();if(auth.session)enter();else setStatus('Não autenticado',true)})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
